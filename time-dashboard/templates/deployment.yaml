apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "time-dashboard.fullname" . }}
  labels:
    {{- include "time-dashboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "time-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "time-dashboard.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "time-dashboard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VM_URL
              value: {{ .Values.metrics.url | quote }}
            - name: VM_TIMEOUT
              value: {{ .Values.metrics.timeout | quote }}
            - name: CACHE_SECONDS
              value: {{ .Values.cacheSeconds | quote }}
            - name: SERVER_NAME
              value: {{ .Values.server.name | quote }}
            - name: SERVER_LOCATION
              value: {{ .Values.server.location | quote }}
            - name: SERVER_HARDWARE
              value: {{ .Values.server.hardware | quote }}
            - name: POOL_URL
              value: {{ .Values.server.poolUrl | quote }}
            - name: SERVER_IPV6
              value: {{ .Values.server.ipv6 | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # readOnlyRootFilesystem is on, and gunicorn wants somewhere to put its
          # worker heartbeat files. An emptyDir in memory keeps that off the disk and
          # off any node-local path.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
